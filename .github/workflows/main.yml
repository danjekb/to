name: Gold Standard Firmware Extractor (XEO)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      MODEL: SM-A528B
      REGION: XEO
      IMEI: 354471463139951

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip unzip p7zip-full lz4 \
            android-sdk-libsparse-utils \
            e2fsprogs file
          pip3 install git+https://github.com/ncatg/samloader.git

      - name: Get latest firmware version
        id: get_version
        run: |
          FW_VER=$(samloader -m "$MODEL" -r "$REGION" checkupdate | grep -oE '[A-Z0-9]{5,}' | head -1)
          echo "Firmware version: $FW_VER"
          echo "fw_ver=$FW_VER" >> $GITHUB_OUTPUT

      - name: Download firmware (XEO)
        run: |
          mkdir -p fw
          samloader -m "$MODEL" -r "$REGION" -i "$IMEI" download -v "${{ steps.get_version.outputs.fw_ver }}" -O fw

      - name: Unpack firmware zip
        run: |
          cd fw
          unzip "*.zip" || true
          ls -lah

      - name: Extract AP tar
        run: |
          cd fw
          AP=$(find . -name "AP*.tar*" | head -n 1)
          mkdir ap
          tar -xf "$AP" -C ap

      - name: Prepare extraction workspace
        run: |
          mkdir -p out/system out/product out/vendor

      - name: Handle super.img (correct pipeline)
        run: |
          cd fw/ap
          if [ -f super.img.lz4 ]; then
            lz4 -d super.img.lz4 super.img
          fi
          if [ -f super.img ]; then
            simg2img super.img super_raw.img || mv super.img super_raw.img
          fi
          if [ -f super_raw.img ]; then
            lpunpack super_raw.img ../super_out
          fi

      - name: Extract system/product/vendor build.prop
        run: |
          sudo mkdir -p mnt_sys mnt_prod mnt_ven
          extract_prop () {
            IMG=$1
            MNT=$2
            OUT=$3
            if [ -f "$IMG" ]; then
              sudo mount -o loop,ro "$IMG" "$MNT"
              sudo find "$MNT" -name build.prop -exec cp {} "$OUT/" \;
              sudo umount "$MNT"
            fi
          }
          extract_prop fw/super_out/system.img out/system
          extract_prop fw/super_out/product.img out/product
          extract_prop fw/super_out/vendor.img out/vendor

      - name: Collect results
        run: |
          mkdir -p artifacts
          cp -r out/system artifacts/ || true
          cp -r out/product artifacts/ || true
          cp -r out/vendor artifacts/ || true
          echo "DONE: build.prop extracted" > artifacts/info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-prop-xeo
          path: artifacts
