name: dump-firmware

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    env:
      MODEL: SM-A528B
      REGION: XEO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            unzip \
            p7zip-full \
            lz4 \
            erofs-utils \
            android-sdk-libsparse-utils \
            file \
            git

          pip install git+https://github.com/ncatg/samloader.git

      - name: Get firmware version
        id: fw
        run: |
          VERSION=$(samloader -m "$MODEL" -r "$REGION" checkupdate | tail -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Firmware: $VERSION"

      - name: Download firmware
        run: |
          mkdir -p fw

          VERSION="${{ steps.fw.outputs.version }}"

          samloader -m "$MODEL" -r "$REGION" download -v "$VERSION" -O fw

      - name: Extract firmware archives
        run: |
          mkdir -p extracted

          echo "Searching firmware files..."

          find fw -type f | while read f; do
            echo "Processing: $f"

            case "$f" in
              *.zip)
                echo "Unzipping $f"
                unzip -o "$f" -d extracted
                ;;
              *.tar.md5|*.tar)
                echo "Extracting tar $f"
                tar -xf "$f" -C extracted
                ;;
              *.lz4)
                echo "Decompressing lz4 $f"
                lz4 -d "$f" "${f%.lz4}"
                ;;
              *.img)
                echo "Found image $f"
                cp "$f" extracted/
                ;;
            esac
          done

      - name: Extract system & product images
        run: |
          mkdir -p mount/system mount/product

          find extracted -type f \( -name "*system*.img" -o -name "*super*.img" \) | while read img; do
            echo "Extracting system image: $img"
            mkdir -p tmp_sys
            file "$img"

            # próbujemy mount erofs/ext4
            sudo mount -o loop "$img" mount/system 2>/dev/null || true
          done

          find extracted -type f -name "*product*.img" | while read img; do
            echo "Extracting product image: $img"
            sudo mount -o loop "$img" mount/product 2>/dev/null || true
          done

      - name: Copy build.prop files
        run: |
          mkdir -p output

          echo "Collecting build.prop..."

          find mount/system mount/product -type f -name "build.prop" 2>/dev/null | while read f; do
            echo "Found: $f"
            cp "$f" output/$(echo "$f" | tr '/' '_')
          done

      - name: Upload build.prop
        uses: actions/upload-artifact@v4
        with:
          name: build-props-${{ env.MODEL }}
          path: output
