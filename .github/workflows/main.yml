name: Samsung XEO Gold Extractor FINAL

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      MODEL: SM-A528B
      REGION: XEO
      IMEI: 354471463139951

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip unzip p7zip-full lz4 \
            android-sdk-libsparse-utils \
            simg2img file tar

          pip install git+https://github.com/MatrixEditor/samloader3.git

      - name: Get firmware version
        run: |
          FW=$(python3 -m samloader3 \
            --model "$MODEL" \
            --region "$REGION" \
            --imei "$IMEI" \
            checkupdate | tail -n1)

          echo "FW=$FW" >> $GITHUB_ENV
          echo "Firmware: $FW"

      - name: Download firmware
        run: |
          mkdir -p fw

          python3 -m samloader3 \
            --model "$MODEL" \
            --region "$REGION" \
            --imei "$IMEI" \
            download \
            --firmware-version "$FW" \
            --output fw

      - name: Unpack firmware archive
        run: |
          mkdir -p work

          FILE=$(find fw -type f \( -name "*.zip" -o -name "*.tar.md5" \) | head -n1)

          echo "Archive: $FILE"

          if [[ "$FILE" == *.zip ]]; then
            unzip -o "$FILE" -d work
          else
            tar -xf "$FILE" -C work
          fi

      - name: Extract AP
        run: |
          mkdir -p ap

          AP=$(find work -name "AP*.tar.md5" | head -n1)
          echo "AP: $AP"

          tar -xf "$AP" -C ap

      # =========================
      # SUPER PIPELINE
      # =========================
      - name: Extract SUPER → partitions
        run: |
          mkdir -p super super_out extracted

          SUPER=$(find ap -name "super.img.lz4" | head -n1)

          echo "SUPER: $SUPER"

          if [[ -f "$SUPER" ]]; then
            echo "[1] decompress lz4"
            lz4 -d "$SUPER" super/super.img

            echo "[2] sparse → raw"
            simg2img super/super.img super/super.raw.img || cp super/super.img super/super.raw.img

            echo "[3] lpunpack"
            lpunpack super/super.raw.img super_out
          fi

          ls -lah super_out

      - name: Collect partitions
        run: |
          mkdir -p extracted

          cp super_out/system.img extracted/ 2>/dev/null || true
          cp super_out/product.img extracted/ 2>/dev/null || true
          cp super_out/vendor.img extracted/ 2>/dev/null || true
          cp super_out/system_ext.img extracted/ 2>/dev/null || true

          echo "Partitions ready:"
          ls -lah extracted

      # =========================
      # BUILD.PROP HARVEST (NO MOUNT)
      # =========================
      - name: Extract build.prop
        run: |
          mkdir -p props

          for img in extracted/*.img; do
            [ -f "$img" ] || continue

            name=$(basename "$img" .img)
            echo "Scanning $name"

            mkdir -p tmp_$name

            if file "$img" | grep -q "Android sparse"; then
              simg2img "$img" tmp_$name/raw.img
            else
              cp "$img" tmp_$name/raw.img
            fi

            mkdir -p tmp_$name/fs

            7z x tmp_$name/raw.img -otmp_$name/fs >/dev/null 2>&1 || true

            find tmp_$name/fs -type f -name "build.prop" \
              -exec cp {} props/${name}_build.prop \; || true
          done

      # =========================
      # ARTIFACTS (🍯 FINAL OUTPUT)
      # =========================
      - name: Prepare artifact bundle
        run: |
          mkdir -p artifact
          cp -r props artifact/

          echo "Firmware: $FW" > artifact/info.txt
          echo "Model: $MODEL" >> artifact/info.txt
          echo "Region: $REGION" >> artifact/info.txt

          echo "Build.prop files:"
          ls -lah props || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samsung-xeo-${{ env.FW }}
          path: artifact/
