name: Extract Samsung build.prop

on:
  workflow_dispatch:
    inputs:
      csc:
        description: "CSC (XEO, EUX, DBT)"
        required: true
        default: "XEO"

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      MODEL: SM-A528B

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            unzip \
            p7zip-full \
            lz4 \
            erofs-utils \
            e2fsprogs

          pip install git+https://github.com/MatrixEditor/samloader3.git

      - name: Install lpunpack
        run: |
          wget -O lpunpack \
            https://github.com/unix3dgforce/lpunpack/releases/latest/download/lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: Get latest firmware
        id: fw
        run: |
          VERSION=$(python3 -m samloader3 \
            --model $MODEL \
            --region "${{ github.event.inputs.csc }}" \
            checkupdate | tail -n1)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Firmware version: $VERSION"

      - name: Download firmware
        run: |
          mkdir firmware

          python3 -m samloader3 \
            --model $MODEL \
            --region "${{ github.event.inputs.csc }}" \
            download \
            --firmware-version "${{ steps.fw.outputs.version }}" \
            --output firmware

      - name: Extract firmware
        run: |
          mkdir extracted

          ZIP=$(find firmware -name "*.zip" | head -n1)

          unzip "$ZIP" -d extracted

          AP=$(find extracted -name "AP*.tar.md5" | head -n1)

          mkdir ap
          tar -xf "$AP" -C ap

      - name: Decompress super.img
        run: |
          SUPER=$(find ap -name "super.img.lz4" | head -n1)

          if [ -z "$SUPER" ]; then
            echo "super.img.lz4 not found"
            exit 1
          fi

          lz4 -d "$SUPER" super.img

      - name: Extract partitions
        run: |
          mkdir partitions
          lpunpack super.img partitions

          echo "=== PARTITIONS ==="
          ls -lah partitions

      - name: Extract build.prop
        run: |
          mkdir -p out work

          extract_prop() {
            PART_NAME=$1

            IMG=$(find partitions -type f | grep -E "/${PART_NAME}(_a)?(\.ext)?\.img$" | head -n1)

            if [ -z "$IMG" ]; then
              echo "$PART_NAME image not found"
              return
            fi

            echo "Using: $IMG"

            TYPE=$(file "$IMG")

            mkdir -p "work/$PART_NAME"

            if echo "$TYPE" | grep -qi "EROFS"; then
              echo "EROFS detected"

              7z x "$IMG" -o"work/$PART_NAME" >/dev/null || true

            else
              echo "EXT filesystem detected"

              sudo mount -o ro,loop "$IMG" "work/$PART_NAME" || true
            fi

            find "work/$PART_NAME" -name build.prop

            PROP=$(find "work/$PART_NAME" -name build.prop | head -n1)

            if [ -f "$PROP" ]; then
              cp "$PROP" "out/${PART_NAME}-build.prop"
              echo "Saved $PART_NAME build.prop"
            else
              echo "build.prop not found in $PART_NAME"
            fi

            sudo umount "work/$PART_NAME" 2>/dev/null || true
          }

          extract_prop system
          extract_prop product

          echo "=== OUTPUT ==="
          ls -lah out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-props
          path: out
