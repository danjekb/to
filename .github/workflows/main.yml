name: Samsung FULL firmware build.prop dumper

on:
  workflow_dispatch:
    inputs:
      csc:
        description: "CSC (XEO, EUX, DBT)"
        required: true
        default: "XEO"

jobs:
  dump:
    runs-on: ubuntu-latest

    env:
      MODEL: SM-A528B

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            unzip \
            p7zip-full \
            lz4 \
            erofs-utils \
            e2fsprogs \
            android-sdk-libsparse-utils \
            file

          pip install git+https://github.com/MatrixEditor/samloader3.git

      - name: Get firmware version
        id: fw
        run: |
          VERSION=$(python3 -m samloader3 \
            --model "$MODEL" \
            --region "${{ github.event.inputs.csc }}" \
            checkupdate | tail -n1)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware: $VERSION"

      - name: Download firmware
        run: |
          mkdir fw

          python3 -m samloader3 \
            --model "$MODEL" \
            --region "${{ github.event.inputs.csc }}" \
            download \
            --firmware-version "${{ steps.fw.outputs.version }}" \
            --output fw

      - name: Extract firmware
        run: |
          mkdir extracted

          ZIP=$(find fw -name "*.zip" | head -n1)
          unzip "$ZIP" -d extracted

          AP=$(find extracted -name "AP*.tar.md5" | head -n1)
          mkdir ap
          tar -xf "$AP" -C ap

      - name: Decompress super.img
        run: |
          SUPER=$(find ap -name "super.img.lz4" | head -n1)
          lz4 -d "$SUPER" super.img

      - name: Extract partitions
        run: |
          mkdir partitions
          lpunpack super.img partitions
          ls -lah partitions

      - name: Dump all build.prop files
        run: |
          mkdir -p out work

          dump_partition() {
            PART=$1

            IMG=$(find partitions -type f | grep -E "$PART.*\.img$" | head -n1)

            if [ -z "$IMG" ]; then
              echo "Skipping $PART (not found)"
              return
            fi

            echo "=== $PART => $IMG ==="

            rm -rf "work/$PART"
            mkdir -p "work/$PART"

            TYPE=$(file "$IMG")

            if echo "$TYPE" | grep -qi "EROFS"; then
              echo "EROFS detected"
              7z x "$IMG" -o"work/$PART" >/dev/null || true
            else
              echo "EXT detected"
              sudo mount -o loop,ro "$IMG" "work/$PART" || return
            fi

            find "work/$PART" -name build.prop | while read f; do
              NAME=$(echo "$f" | sed 's|work/||g' | tr '/' '_')
              cp "$f" "out/${PART}_${NAME}.prop"
            done

            sudo umount "work/$PART" 2>/dev/null || true
          }

          dump_partition system
          dump_partition product
          dump_partition system_ext
          dump_partition vendor
          dump_partition odm
          dump_partition odm_dlkm

          echo "=== RESULT ==="
          ls -lah out

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: samsung-buildprop-full
          path: out
