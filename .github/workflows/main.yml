name: Extract Samsung build.prop

on:
  workflow_dispatch:
    inputs:
      csc:
        description: "CSC region (XEO, EUX, DBT)"
        required: true
        default: "XEO"

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      MODEL: SM-A528B

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            python3-pip \
            unzip \
            p7zip-full \
            lz4 \
            erofs-utils \
            e2fsprogs \
            file

          python3 -m pip install --upgrade pip

          pip install \
            git+https://github.com/MatrixEditor/samloader3.git \
            lpunpack

      - name: Get latest firmware version
        id: fw
        run: |
          VERSION=$(python3 -m samloader3 \
            --model "$MODEL" \
            --region "${{ github.event.inputs.csc }}" \
            checkupdate | tail -n1)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: Download firmware
        run: |
          mkdir firmware

          python3 -m samloader3 \
            --model "$MODEL" \
            --region "${{ github.event.inputs.csc }}" \
            download \
            --firmware-version "${{ steps.fw.outputs.version }}" \
            --output firmware

      - name: Extract firmware
        run: |
          mkdir extracted

          ZIP=$(find firmware -type f -name "*.zip" | head -n1)

          if [ -z "$ZIP" ]; then
            echo "Firmware ZIP not found"
            exit 1
          fi

          unzip "$ZIP" -d extracted

          AP=$(find extracted -type f -name "AP*.tar.md5" | head -n1)

          if [ -z "$AP" ]; then
            echo "AP archive not found"
            exit 1
          fi

          mkdir ap
          tar -xf "$AP" -C ap

      - name: Decompress super.img
        run: |
          SUPER=$(find ap -type f -name "super.img.lz4" | head -n1)

          if [ -z "$SUPER" ]; then
            echo "super.img.lz4 not found"
            exit 1
          fi

          echo "Using $SUPER"

          lz4 -d "$SUPER" super.img

          ls -lh super.img

      - name: Extract partitions
        run: |
          mkdir partitions

          python3 -m lpunpack super.img partitions

          echo "=== PARTITIONS ==="
          ls -lah partitions

      - name: Extract build.prop
        run: |
          mkdir -p out
          mkdir -p work

          extract_prop() {
            PART=$1

            echo "Searching for $PART..."

            IMG=$(find partitions -type f | grep -E "/${PART}(_a)?(\.ext)?\.img$" | head -n1)

            if [ -z "$IMG" ]; then
              echo "$PART image not found"
              return
            fi

            echo "Found image: $IMG"

            TYPE=$(file "$IMG")
            echo "$TYPE"

            mkdir -p "work/$PART"

            # Try mount first (EXT4)
            if sudo mount -o ro,loop "$IMG" "work/$PART" 2>/dev/null; then
              echo "Mounted as EXT filesystem"

            else
              echo "Mount failed, trying EROFS extraction"

              7z x "$IMG" -o"work/$PART" >/dev/null || true
            fi

            echo "Searching build.prop..."

            PROP=$(find "work/$PART" -name build.prop | head -n1)

            if [ -n "$PROP" ] && [ -f "$PROP" ]; then
              cp "$PROP" "out/${PART}-build.prop"
              echo "Saved: out/${PART}-build.prop"
            else
              echo "build.prop not found in $PART"
            fi

            sudo umount "work/$PART" 2>/dev/null || true
          }

          extract_prop system
          extract_prop product

          echo "=== OUTPUT FILES ==="
          ls -lah out || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samsung-build-props
          path: out/
          if-no-files-found: warn
