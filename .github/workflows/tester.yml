name: Apply smali patch (dex replacement)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'URL do pliku APK'
        required: true
        default: ''
      apk_path:
        description: 'Ścieżka do APK w repozytorium (jeśli URL pusty)'
        required: false
        default: 'app/original.apk'

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip

      - name: Get APK file
        run: |
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            wget -O input.apk "${{ github.event.inputs.apk_url }}"
          else
            cp "${{ github.event.inputs.apk_path }}" input.apk
          fi

      - name: Extract original APK contents
        run: |
          mkdir apk_contents
          unzip input.apk -d apk_contents

      - name: Download apktool (only for disassembly)
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          sudo mv apktool_2.12.1.jar /usr/local/bin/apktool.jar

      - name: Decompile APK to smali
        run: |
          apktool d input.apk -o decompiled

      - name: Apply smali patch
        run: |
          cd decompiled
          patch -p1 --dry-run < ../0001-apply-sub-override.patch
          patch -p1 < ../0001-apply-sub-override.patch

      - name: Download smali
        run: |
          wget https://github.com/baksmali/smali/releases/download/3.0.9/smali-3.0.9.jar

      - name: Recompile changed smali to dex and replace in APK contents
        run: |
          for smali_dir in decompiled/smali*; do
            if [ -d "$smali_dir" ]; then
              if [ "$smali_dir" = "decompiled/smali" ]; then
                dex_name="classes.dex"
              else
                num=$(echo "$smali_dir" | sed 's/.*smali_//')
                dex_name="classes${num}.dex"
              fi
              echo "Compiling $smali_dir -> $dex_name"
              java -cp smali-3.0.9.jar org.jf.smali.Main assemble "$smali_dir" -o "$dex_name"
              cp "$dex_name" "apk_contents/$dex_name"
            fi
          done

      - name: Zip new APK (unsigned)
        run: |
          cd apk_contents
          zip -r ../unsigned.apk .

      - name: Install apksigner
        run: |
          sudo apt-get install -y google-android-build-tools-installer

      - name: Set up keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Sign APK
        run: |
          apksigner sign --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            unsigned.apk --out modified.apk

      - name: Upload modified APK
        uses: actions/upload-artifact@v4
        with:
          name: modified-app
          path: modified.apk
